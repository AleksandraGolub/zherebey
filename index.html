<title>Жребий</title>
<style>
  :root{
    --paper:#efe9dc;
    --paper-hi:#f7f2e7;
    --ink:#17140f;
    --ink-soft:#3f382f;
    --muted:#6d6254;
    --faint:#94876e;
    --rule:#cfc3aa;
    --accent:#a8412a;
    --accent-soft:#f0ddd3;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-size:17px;line-height:1.5;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  body.dark{background:var(--ink);color:var(--paper-hi)}
  .wrap{
    max-width:440px;margin:0 auto;
    padding:calc(22px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));
  }
  .hidden{display:none !important}
  hr.rule{border:0;border-top:1px solid var(--rule);margin:0}
  .caps{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- шапка ---------- */
  .masthead{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px}
  .wordmark{font-family:var(--sans);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink)}
  .chapter{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

  /* ---------- старт ---------- */
  .start-top{display:flex;justify-content:space-between;align-items:baseline}
  h1{
    font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.02;
    letter-spacing:-.015em;margin:34px 0 16px;
  }
  h1 em{font-style:italic;color:var(--accent)}
  .lede{font-size:17.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 30px;max-width:30ch}
  #s-start{display:flex;flex-direction:column;min-height:calc(100dvh - 74px)}
  .btn{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--paper-hi);
    font-family:var(--sans);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;
    padding:19px 20px;border-radius:2px;cursor:pointer;
  }
  .btn:active{opacity:.86}
  .btn .arrow{font-family:var(--serif);font-size:16px;letter-spacing:0}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
  .btn.ink{background:var(--paper-hi);color:var(--ink);border-color:var(--paper-hi)}
  .links{display:flex;gap:18px;margin-top:18px}
  .links button{
    background:none;border:0;padding:0;font-family:var(--sans);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;
    border-bottom:1px solid var(--rule);padding-bottom:2px;
  }
  .manifest{margin:auto 0 0;font-size:19px;line-height:1.42;font-style:italic;color:var(--ink-soft);padding-top:44px}
  .ladder{display:flex;gap:4px;margin-top:22px;align-items:flex-end}
  .ladder i{display:block;flex:1;height:12px;background:#ded4be}
  .ladder i.first{background:var(--accent)}
  .ladder-note{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:9px}

  /* ---------- жизнь ---------- */
  .ident{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 0}
  .ident-name{font-size:17px}
  .ident-meta{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .agebar{display:flex;align-items:flex-end;gap:12px;padding:14px 0 4px}
  .age{font-size:40px;line-height:.95;letter-spacing:-.02em}
  .age-unit{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:7px}
  .stage-name{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:auto;padding-bottom:4px}

  .ledger{padding:14px 0 6px;border-top:1px solid var(--rule);margin-top:12px}
  .ledger-row{display:grid;grid-template-columns:78px 1fr 34px;gap:12px;align-items:center;padding:5px 0}
  .ledger-label{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .dots{display:flex;gap:3px}
  .dots i{display:block;height:4px;flex:1;background:#ded4be;border-radius:0}
  .dots i.on{background:var(--ink)}
  .ledger-val{font-size:14px;text-align:right;color:var(--ink-soft)}
  .ledger-row.money{border-top:1px solid var(--rule);margin-top:6px;padding-top:9px;grid-template-columns:1fr auto}
  .ledger-row.money .ledger-val{font-size:14.5px}
  .ledger-row.money .neg{color:var(--accent)}

  .chronicle{margin:20px 0 26px}
  .chron-entry{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:9px 0;border-top:1px solid rgba(214,203,181,.7)}
  .chron-entry:first-child{border-top:0}
  .chron-year{font-family:var(--sans);font-size:10.5px;letter-spacing:.04em;color:var(--muted);padding-top:4px;white-space:nowrap}
  .chron-text{font-size:15.5px;line-height:1.45;color:var(--ink-soft)}

  .event{padding-top:4px;animation:rise .26s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.event{animation:none}}
  .kicker{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .event h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.14;letter-spacing:-.01em;margin:0 0 10px}
  .event p{font-size:16.5px;line-height:1.52;color:var(--ink-soft);margin:0 0 18px}
  .options{border-top:1px solid var(--ink)}
  .option{
    display:grid;grid-template-columns:22px 1fr 16px;gap:10px;width:100%;text-align:left;
    align-items:start;min-height:56px;
    background:none;border:0;border-bottom:1px solid var(--rule);padding:15px 4px;cursor:pointer;
    font-family:var(--serif);color:var(--ink);
  }
  .option:active{background:var(--accent-soft)}
  .opt-go{font-family:var(--sans);font-size:12px;color:var(--faint);padding-top:5px;text-align:right}
  .option:active .opt-go{color:var(--accent)}
  .opt-idx{font-family:var(--sans);font-size:10px;letter-spacing:.1em;color:var(--accent);padding-top:6px}
  .opt-label{display:block;font-size:17px;line-height:1.35}
  .opt-sub{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;color:var(--muted);margin-top:3px}
  .option.next{grid-template-columns:1fr auto}
  .option.next .opt-label{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}

  /* ---------- смерть ---------- */
  .dark .masthead .wordmark, .dark .masthead .chapter{color:var(--paper-hi)}
  .dark .rule{border-color:rgba(247,242,231,.18)}
  .obit-top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px}
  .obit-kicker{font-family:var(--sans);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#b9ad99}
  .obit-age{font-size:104px;line-height:.86;letter-spacing:-.03em;margin:26px 0 4px}
  .obit-unit{font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#d6cbb6;margin-left:10px}
  .obit-place{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cdc2ae;margin-bottom:26px}
  .obit-quote{font-size:23px;line-height:1.34;font-style:italic;margin:0 0 6px}
  .obit-quote-by{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#c4b9a4;margin-bottom:28px}
  .dl{border-top:1px solid rgba(247,242,231,.18);margin-bottom:26px}
  .dl-row{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(247,242,231,.12)}
  .dl-k{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c4b9a4;padding-top:3px}
  .dl-v{font-size:15.5px;line-height:1.4}
  .dark .ledger{border-color:rgba(247,242,231,.18)}
  .dark .dots i{background:rgba(247,242,231,.22)}
  .dark .dots i.on{background:var(--paper-hi)}
  .dark .ledger-label{color:#c4b9a4}
  .dark .ledger-val{color:#efe7d8}
  .dark .dots i{background:rgba(247,242,231,.28)}
  .dark .chron-entry{border-color:rgba(247,242,231,.12)}
  .dark .chron-text{color:#d8cfbd}
  .dark .chron-year{color:#c4b9a4}
  .section-title{font-family:var(--sans);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#c4b9a4;margin:0 0 10px}
  .dark .btn{background:var(--paper-hi);color:var(--ink);border-color:var(--paper-hi)}
  .dark .btn.ghost{background:transparent;color:var(--paper-hi);border-color:rgba(247,242,231,.3)}

  /* ---------- карточка ---------- */
  .poster{
    background:var(--paper-hi);border:1px solid var(--ink);padding:22px;position:relative;margin-bottom:18px;
  }
  .poster:before{
    content:"";position:absolute;inset:6px;border:1px solid var(--rule);pointer-events:none;
  }
  .poster .wordmark{font-size:10px;letter-spacing:.36em}
  .poster-age{font-size:76px;line-height:.88;letter-spacing:-.03em;margin:18px 0 2px}
  .poster-age-unit{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .poster-name{font-size:20px;margin:14px 0 2px}
  .poster-place{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .poster-foot{font-family:var(--sans);font-size:10.5px;line-height:1.5;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}

  /* ---------- архив и правила ---------- */
  .arch-row{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:baseline;padding:14px 0;border-top:1px solid var(--rule);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:default}
  .arch-age{font-size:30px;line-height:1}
  .arch-body{font-size:14.5px;color:var(--ink-soft)}
  .arch-meta{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:4px}
  .how h3{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:26px 0 8px}
  .how p{font-size:16.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 4px}
  .how .src{font-size:14px;color:var(--muted)}
  .toast{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:var(--paper-hi);font-family:var(--sans);font-size:12px;letter-spacing:.08em;
    padding:11px 16px;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.on{opacity:.96}
</style>
</head>

/* ================== МАТЕМАТИКА ================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gauss(rnd){
  let u = 0, v = 0;
  while(u === 0) u = rnd();
  while(v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function pick(rnd, arr){ return arr[Math.floor(rnd() * arr.length)]; }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }

const ECON = {wageShare:0.42, surplusBase:0.075, surplusK:1/900, pension:0.46, partial:0.78,
              healthYoung:0.05, healthMid:0.16, healthOld:0.30, shockP:0.30};

/* вес страны — доля рождений, сглаженная корнем: иначе Индия выпадает
   в каждой второй жизни и играть становится скучно. Это продуктовое
   решение, оно названо в разделе «как это работает». */
const COUNTRY_W = COUNTRIES.map(c => Math.pow(c.share, 0.5));
function pickCountry(rnd, avoid){
  const total = COUNTRY_W.reduce((a, b) => a + b, 0);
  for(let attempt = 0; attempt < 3; attempt++){
    let x = rnd() * total;
    for(let i = 0; i < COUNTRIES.length; i++){
      x -= COUNTRY_W[i];
      if(x <= 0){
        if(avoid && COUNTRIES[i].iso === avoid && attempt < 2) break;
        return COUNTRIES[i];
      }
    }
  }
  return COUNTRIES[0];
}
function lastCountry(){
  try{ return localStorage.getItem("zherebey.last") || null; }catch(e){ return null; }
}
function rememberCountry(iso){
  try{ localStorage.setItem("zherebey.last", iso); }catch(e){}
}

function makeBirth(seed, avoidIso){
  const rnd = mulberry32(seed >>> 0);
  const c = pickCountry(rnd, avoidIso || null);
  const sex = rnd() < 0.512 ? "m" : "f";
  const rural = rnd() < c.rural;
  const wealth = Math.exp(0.85 * gauss(rnd));
  const name = pick(rnd, sex === "m" ? c.m : c.f) + " " + pick(rnd, c.s);
  const place = rural ? pick(rnd, c.villages) : pick(rnd, c.cities);
  const health0 = clamp(46 + (c.le - 54) * 0.95 + gauss(rnd) * 7, 5, 97);
  return {
    seed, c, sex, name, rural, wealth, place, birthYear: 2026,
    health0,
    happiness0: clamp(50 + gauss(rnd) * 9, 15, 85),
    knowledge0: clamp(36 + gauss(rnd) * 10 + (wealth > 1.5 ? 8 : 0), 5, 80),
    relations0: clamp(48 + gauss(rnd) * 9, 15, 82)
  };
}

function newLife(seed, avoidIso){
  const b = makeBirth(seed, avoidIso);
  return {
    b, stage: 0, age: 0,
    h: b.health0, p: b.happiness0, k: b.knowledge0, r: b.relations0,
    money: 0, children: 0, students: 0, houses: 0, letters: 0, helped: 0,
    used: [], log: [], dead: false, deathAge: null, cause: null,
    wage: 0
  };
}

function stageOf(L){ return STAGES[L.stage]; }

function wageMonthly(L){
  const b = L.b;
  const gap = b.sex === "f" ? 0.88 : 1;
  return (b.c.gdp * ECON.wageShare / 12) * (0.55 + L.k / 130) * (b.rural ? 0.78 : 1) * gap;
}

function applyEconomy(L, span){
  const st = stageOf(L);
  if(st.age < 15) return 0;
  let w = wageMonthly(L) * 12;
  if(st.age >= 65) w *= ECON.pension;
  else if(st.age >= 56) w *= ECON.partial;
  L.wage = w;
  const surplus = w * (ECON.surplusBase + L.k / 900);
  L.money += surplus * span;
  const rate = st.age >= 65 ? ECON.healthOld : st.age >= 50 ? ECON.healthMid : ECON.healthYoung;
  const hc = w * rate * (L.h < 45 ? 1.9 : 1);
  L.money -= hc * span;
  /* после выхода на пенсию глубже нуля не уходят: долг гасит семья или государство */
  if(st.age >= 65 && L.money < 0){ L.money = 0; L.bankrupt = true; }
  return surplus * span - hc * span;
}

function maybeShock(L, rnd){
  if(L.stage < 4) return null;
  if(rnd() > ECON.shockP) return null;
  const w = L.wage || wageMonthly(L) * 12;
  const roll = rnd();
  let cost, text;
  if(roll < 0.45){
    cost = w * (0.35 + rnd() * 1.1);
    text = "Кто-то из семьи попал в больницу.";
  } else if(roll < 0.75){
    cost = w * (0.3 + rnd() * 0.9);
    text = "Работа или дело просело на несколько месяцев.";
  } else {
    cost = w * (0.7 + rnd() * 1.8);
    text = "Пришлось закрыть чужой долг.";
  }
  L.money -= cost;
  return {text, cost};
}

function pickEvent(L, rnd, allowPrio){
  const pool = EVENTS.filter(e =>
    e.st === L.stage &&
    !L.used.includes(e.id) &&
    (!e.cond || e.cond(L.b, L))
  );
  if(!pool.length) return null;
  let ev = null;
  if(allowPrio !== false){
    const prio = pool.filter(e => e.prio);
    if(prio.length) ev = prio[0];
  }
  if(!ev){
    const rest = pool.filter(e => !e.prio);
    if(!rest.length) return null;
    ev = pick(rnd, rest);
  }
  L.used.push(ev.id);
  return ev;
}

/* выживаемость: логистическая кривая вокруг медианы смертности страны.
   Медиана смертности выше ожидаемой продолжительности жизни при рождении,
   потому что средняя включает младенческие смерти. */
function deathProb(L, age){
  const le = L.b.c.le;
  const a50 = le + (le >= 75 ? 0 : 2.5);
  const s = le >= 75 ? 10 : 8.5;
  const S = a => 1 / (1 + Math.exp((a - a50) / s));
  let p = 1 - S(age + 1) / S(age);
  p *= 1 + Math.max(0, 45 - L.h) / 50;
  return clamp(p, 0, 0.99);
}

/* прогон смертности по годам внутри главы: возвращает возраст смерти или null */
function advanceMortality(L, rnd, fromAge, span){
  if(fromAge === 0 && rnd() < L.b.c.imr / 1000) return 0;
  const start = Math.max(1, fromAge);
  for(let y = start; y < fromAge + span; y++){
    if(rnd() < deathProb(L, y)) return y;
  }
  return null;
}

function causeFor(age, rnd){
  if(age < 1) return pick(rnd, ["инфекция в первые недели", "осложнения при рождении", "недоношенность"]);
  if(age < 15) return pick(rnd, ["несчастный случай", "тяжёлая инфекция", "авария на дороге"]);
  if(age < 40) return pick(rnd, ["авария", "несчастный случай", "болезнь сердца", "осложнения после болезни"]);
  if(age < 65) return pick(rnd, ["сердце", "рак", "инсульт", "осложнения диабета"]);
  return pick(rnd, ["сердце", "инсульт", "пневмония", "просто возраст"]);
}

function lastWords(L, rnd){
  if(L.deathAge < 20) return "«Не плачьте, ладно».";
  if(L.children > 0 && L.r > 55) return pick(rnd, ["«Идите ешьте, я полежу»", "«Не сидите тут, у вас дела»"]);
  if(L.money > 0 && L.r < 40) return pick(rnd, ["«Дом не продавайте»", "«Деньги в шкафу, в синей коробке»"]);
  if(L.money <= 0 && L.children > 0) return pick(rnd, ["«Долг отдайте, если сможете»", "«Простите, что не оставил ничего»"]);
  if(L.r < 40) return pick(rnd, ["«Свет оставьте, я посижу»", "«Хорошо, что вы пришли»"]);
  return pick(rnd, ["«Хорошая была жизнь. Не идеальная, но хорошая»", "«Всё, хватит»"]);
}

/* полный прогон без DOM — для симуляции «как прожили другие» */
function autoRun(seed, choiceRule, runIndex){
  const mix = (seed ^ 0x9E3779B9 ^ Math.imul((runIndex || 0) + 1, 2654435761)) >>> 0;
  const rnd = mulberry32(mix);
  const L = newLife(seed);
  while(!L.dead){
    const st = stageOf(L);
    const died = advanceMortality(L, rnd, st.age, st.span);
    if(died !== null){
      L.dead = true; L.deathAge = died; L.cause = causeFor(died, rnd); break;
    }
    applyEconomy(L, st.span);
    maybeShock(L, rnd);
    let ev = pickEvent(L, rnd, true);
    while(ev){
      const idx = choiceRule(rnd, ev, L);
      const opt = ev.o[idx];
      L.money += moneyDelta(L, opt.e.m);
      applyEffects(L, opt.e);
      ev = ev.prio ? pickEvent(L, rnd, false) : null;
    }
    L.age = st.age + st.span;
    L.stage++;
    if(L.stage >= STAGES.length){
      L.dead = true; L.deathAge = Math.min(99, L.age); L.cause = causeFor(L.deathAge, rnd); break;
    }
  }
  return L;
}

function applyEffects(L, e){
  if(!e) return;
  L.h = clamp(L.h + (e.h || 0), 1, 98);
  L.p = clamp(L.p + (e.p || 0), 1, 98);
  L.k = clamp(L.k + (e.k || 0), 1, 98);
  L.r = clamp(L.r + (e.r || 0), 1, 98);
  if(e.c) L.children += e.c;
  if(e.st) L.students += e.st;
  if(e.ho) L.houses += e.ho;
  if(e.le) L.letters += e.le;
  if(e.he) L.helped += e.he;
}
/* m в вариантах — месячные зарплаты страны, считается до применения эффектов */
function moneyDelta(L, m){
  if(!m) return 0;
  if(STAGES[L.stage].age < 16) return 0;   /* до 16 это деньги семьи, а не героя */
  return m * wageMonthly(L);
}

/* ================== ФОРМАТ ================== */
const nf = new Intl.NumberFormat("ru-RU");
function money(n){
  const v = Math.round(Math.abs(n) / 100) * 100;
  return (n < 0 ? "−" : "") + nf.format(v).replace(/\s/g, "\u00A0") + "\u00A0$";
}
function nb(s){ return String(s).replace(/ /g, "\u00A0"); }
function years(n){ return nb(n) + "\u00A0" + plural(n, "год", "года", "лет"); }
function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return many;
  if(b > 1 && b < 5) return few;
  if(b === 1) return one;
  return many;
}
function wealthLine(b){
  const w = b.wealth;
  let money_, cls;
  if(w < 0.4){ money_ = "в доме считали каждую монету"; }
  else if(w < 0.75){ money_ = "денег хватало до середины месяца"; }
  else if(w < 1.5){ money_ = "жили как все вокруг"; }
  else if(w < 3){ money_ = "жили лучше соседей"; }
  else { money_ = "денег было больше, чем нужно"; }
  return money_;
}
function placePhrase(b){
  return b.rural ? b.place : "в " + b.place;
}
function originLine(b){
  const le = Math.round(b.c.le);
  return b.place.charAt(0).toUpperCase() + b.place.slice(1) + ", " + b.c.ru + ". Средняя жизнь здесь — " +
         le + " " + plural(le, "год", "года", "лет") + ". Семья: " + wealthLine(b) + ".";
}


/* ================== ХРОНИКА ================== */
const $ = id => document.getElementById(id);
const screens = ["s-start","s-life","s-death","s-card","s-archive","s-how"];
const ROMAN = ["0","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII"];

function show(which){
  screens.forEach(s => $(s).classList.toggle("hidden", s !== which));
  document.body.classList.toggle("dark", which === "s-death");
  window.scrollTo(0,0);
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 1500);
}
function dots(v){
  const n = clamp(v,0,100)/5;               // 20 делений по 5
  const full = Math.floor(n), part = n - full;
  let h = "";
  for(let i=0;i<20;i++){
    if(i < full) h += '<i class="on"></i>';
    else if(i === full && part > 0.02) h += '<i class="on" style="opacity:' + (0.25 + part*0.75).toFixed(2) + '"></i>';
    else h += "<i></i>";
  }
  return '<span class="dots">' + h + "</span>";
}

let L = null, currentEvent = null;

function legacyLine(){
  const parts = [];
  if(L.children) parts.push(L.children + " " + plural(L.children,"ребёнок","ребёнка","детей"));
  if(L.students) parts.push(L.students + " " + plural(L.students,"ученик","ученика","учеников"));
  if(L.houses) parts.push(L.houses + " " + plural(L.houses,"дом","дома","домов"));
  if(L.letters) parts.push(L.letters + " " + plural(L.letters,"письмо","письма","писем"));
  if(L.helped) parts.push("забота о близких");
  if(L.money > 0) parts.push("сбережения " + money(L.money));
  if(L.money < 0) parts.push("долг " + money(Math.abs(L.money)));
  return parts.length ? parts.join(", ") : "после не осталось почти ничего";
}

function peersStats(){
  const n = 200, ages = [], moneys = [];
  for(let i=0;i<n;i++){
    const sim = autoRun(L.b.seed, (rnd, ev) => Math.floor(rnd()*ev.o.length), i+1);
    ages.push(sim.deathAge); moneys.push(sim.money);
  }
  ages.sort((a,b)=>a-b); moneys.sort((a,b)=>a-b);
  return {n, median: ages[Math.floor(n/2)], young: Math.round(100*ages.filter(a=>a<30).length/n),
          max: ages[n-1], broke: Math.round(100*moneys.filter(m=>m<=0).length/n)};
}

/* ---------- старт ---------- */
function startLife(seed){
  L = newLife(seed, lastCountry());
  rememberCountry(L.b.c.iso);
  currentEvent = null;
  L.log.push({yr:"2026", tx: originLine(L.b)});
  show("s-life");
  renderHeader(); renderScales(); renderFeed();
  nextStage(true);
}

function renderHeader(){
  $("who-name").textContent = L.b.name;
  $("who-meta").textContent = L.b.c.ru;
  $("ch").textContent = "глава " + ROMAN[Math.min(L.stage+1,13)] + " / XIII";

  $("age-unit").textContent = plural(L.age,"год","года","лет");
  $("stage").textContent = stageOf(L).name;
}

function renderScales(){
  const rows = [["здоровье",L.h],["счастье",L.p],["знания",L.k],["близкие",L.r]];

    '<div class="ledger-row"><span class="ledger-label">' + lab + '</span>' + dots(v) +
    '<span class="ledger-val num">' + Math.round(v) + "</span></div>").join("");
  html += '<div class="ledger-row money"><span class="ledger-label">' + (L.money < 0 ? "долг" : "накопления") + '</span>' +
    '<span class="ledger-val num ' + (L.money<0?"neg":"") + '">' + money(L.money) + "</span></div>";
  $("scales").innerHTML = html;
}

function renderFeed(){
  const last = L.log.slice(-4);
  $("feed").innerHTML = last.map(en =>
    '<div class="chron-entry"><div class="chron-year">' + en.yr + '</div>' +
    '<div class="chron-text">' + en.tx + "</div></div>").join("");
}

function renderEvent(){
  if(!currentEvent){
    $("event").innerHTML = '<div class="kicker">дальше</div><h2>Годы идут</h2>' +
      '<div class="options"><button class="option next" data-next="1">' +
      '<span class="opt-label">прожить</span><span class="opt-go">→</span></button></div>';
    return;
  }
  const ev = currentEvent;
  let html = '<div class="kicker">' + (ev.prio ? "развилка · выбор обязателен" : "событие") + "</div>";
  html += "<h2>" + ev.t + "</h2><p>" + ev.x + "</p><div class=\"options\">";
  ev.o.forEach((o,i) => {
    html += '<button class="option" data-i="' + i + '"><span class="opt-idx num">' + (i+1) + "</span>" +
      '<span class="opt-body"><span class="opt-label">' + o.a + "</span>" +
      (o.s ? '<span class="opt-sub">' + o.s + "</span>" : "") + '</span><span class="opt-go">→</span></button>';
  });
  $("event").innerHTML = html + "</div>";
}

function stageLabel(age){
  const y = L.b.birthYear + age, span = STAGES[L.stage].span;
  return y + "–" + String(y + span).slice(2);
}

function nextStage(first){
  if(L.stage >= STAGES.length){ finishLife(); return; }
  const st = stageOf(L);
  L.age = st.age;
  renderHeader();
  const died = advanceMortality(L, Math.random, st.age, st.span);
  if(died !== null){ finishLife(died); return; }
  const surplus = applyEconomy(L, st.span);
  const label = stageLabel(st.age);
  if(surplus < 0) L.log.push({yr: label, tx:"Расходы больше заработка."});
  const shock = maybeShock(L, Math.random);
  if(shock) L.log.push({yr: label, tx: shock.text + " (" + money(-shock.cost) + "). На счёте " + money(L.money) + "."});
  renderScales(); renderFeed();
  currentEvent = pickEvent(L, Math.random, !first);
  renderEvent();
  $("event").scrollIntoView({block:"nearest"});
}

function choose(i){
  const ev = currentEvent, opt = ev.o[i];
  const delta = moneyDelta(L, opt.e.m);
  L.money += delta;
  applyEffects(L, opt.e);
  const st = stageOf(L);
  let tx = opt.a;
  if(opt.s) tx += ". " + opt.s.charAt(0).toUpperCase() + opt.s.slice(1);
  if(delta) tx += " (" + (delta>0?"+":"") + money(delta) + ")";
  L.log.push({yr: stageLabel(st.age), tx: tx + "."});
  currentEvent = null;
  if(ev.prio){
    const second = pickEvent(L, Math.random, false);
    if(second){ currentEvent = second; renderScales(); renderFeed(); renderEvent();
      $("event").scrollIntoView({block:"nearest"}); return; }
  }
  L.stage++;
  L.age = st.age + st.span;
  renderScales(); renderFeed();
  nextStage(false);
}

function finishLife(age){
  const rnd = Math.random;
  const a = age != null ? age : Math.min(101, L.age);
  L.dead = true; L.deathAge = a; L.cause = causeFor(a, rnd);
  saveLife();
  renderDeath();
  show("s-death");
}

/* ---------- смерть ---------- */
function renderDeath(){
  const b = L.b, peers = peersStats();
  const le = Math.round(b.c.le), diff = L.deathAge - le;
  const diffLine = diff === 0
    ? "Ровно средняя продолжительность жизни по стране — " + years(le) + "."
    : (diff > 0 ? "Средняя продолжительность жизни здесь — " + years(le) + ". Ты прожил на " + years(diff) + " больше."
                : "Средняя продолжительность жизни здесь — " + years(le) + ". Ты прожил на " + years(-diff) + " меньше.");
  const rows = [["здоровье",L.h],["счастье",L.p],["знания",L.k],["близкие",L.r]];
  const chron = L.log.slice(-5).map(en =>
    '<div class="chron-entry"><div class="chron-year">' + en.yr + '</div><div class="chron-text">' + en.tx + "</div></div>").join("");

  $("s-death").innerHTML =
    '<div class="obit-top"><div class="wordmark">Жребий</div><div class="chapter">запись о жизни</div></div>' +
    '<hr class="rule">' +
    '<div class="obit-age num">' + L.deathAge + '<span class="obit-unit">' + plural(L.deathAge,"год","года","лет") + "</span></div>" +
    '<div class="obit-place">' + b.place + " · " + b.c.ru + "</div>" +
    '<p class="obit-quote">' + lastWords(L, Math.random) + "</p>" +
    '<div class="obit-quote-by">последние слова</div>' +
    '<div class="dl">' +
      '<div class="dl-row"><div class="dl-k">кто</div><div class="dl-v">' + b.name + ", " + (b.sex==="m"?"мужчина":"женщина") + "</div></div>" +
      '<div class="dl-row"><div class="dl-k">причина</div><div class="dl-v">' + L.cause + "</div></div>" +
      '<div class="dl-row"><div class="dl-k">осталось</div><div class="dl-v">' + legacyLine() + "</div></div>" +
    "</div>" +
    '<div class="section-title">чем закончилось</div>' +
    '<div class="ledger">' + rows.map(([lab,v]) =>
      '<div class="ledger-row"><span class="ledger-label">' + lab + "</span>" + dots(v) +
      '<span class="ledger-val num">' + Math.round(v) + "</span></div>").join("") + "</div>" +
    '<div class="section-title" style="margin-top:26px">сравнение</div>' +
    '<p style="font-size:16.5px;line-height:1.5;margin:0 0 8px">' + diffLine + "</p>" +
    '<p style="font-size:14px;line-height:1.55;color:#b9ad99;margin:0 0 26px">Если прожить эту же жизнь ещё двести раз, каждый раз выбирая иначе, вышло бы так: обычно умирали в ' +
      years(peers.median) + ", до 30 лет не доживали " + nb(peers.young) + "%, самый долгий век — " + years(peers.max) +
      ", а с нулём или в долгах заканчивали " + nb(peers.broke) + "% жизней.</p>" +
    '<div class="section-title">последние главы</div><div class="chronicle" style="margin-top:4px">' + chron + "</div>" +
    '<button class="btn" id="btn-card"><span>Карточка жизни</span><span class="arrow">→</span></button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn ghost" id="btn-again"><span>Ещё жизнь</span><span class="arrow">→</span></button>' +
    '<div class="links" style="justify-content:center"><button id="btn-arch2">Прожитые жизни</button></div>';

  $("btn-card").onclick = () => { renderCard(peers); show("s-card"); };
  $("btn-again").onclick = () => startLife((Date.now() ^ (Math.random()*1e9)) >>> 0);
  $("btn-arch2").onclick = () => { renderArchive(); show("s-archive"); };
}

/* ---------- карточка ---------- */
function cardText(){
  const b = L.b;
  return ["ЖРЕБИЙ",
    b.c.ru + ", " + b.birthYear + " · " + (b.sex==="m"?"мужчина":"женщина"),
    L.deathAge + " " + plural(L.deathAge,"год","года","лет") + " · " + b.place,
    "",
    "Здоровье " + Math.round(L.h) + " · Счастье " + Math.round(L.p) + " · Знания " + Math.round(L.k) + " · Близкие " + Math.round(L.r),
    "Осталось: " + legacyLine(),
    "",
    "А как пройдёт твоя?"].join("\n");
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove(); }
}

function renderCard(peers){
  const b = L.b; peers = peers || peersStats();
  const rows = [["здоровье",L.h],["счастье",L.p],["знания",L.k],["близкие",L.r]];
  $("s-card").innerHTML =
    '<div class="masthead"><div class="wordmark">Жребий</div><div class="chapter">карточка</div></div><hr class="rule">' +
    '<div style="height:20px"></div>' +
    '<div class="poster">' +
      '<div class="wordmark">жребий</div>' +
      '<div class="poster-age num">' + L.deathAge + "</div>" +
      '<div class="poster-age-unit">' + plural(L.deathAge,"год жизни","года жизни","лет жизни") + "</div>" +
      '<div class="poster-name">' + b.name + "</div>" +
      '<div class="poster-place">' + b.c.ru + " · " + b.place + " · причина: " + L.cause + "</div>" +
      rows.map(([lab,v]) =>
        '<div class="ledger-row" style="grid-template-columns:78px 1fr 30px"><span class="ledger-label">' + lab + "</span>" +
        dots(v) + '<span class="ledger-val num">' + Math.round(v) + "</span></div>").join("") +
      '<div class="poster-foot">Осталось: ' + legacyLine() + ".<br>Эту же жизнь можно прожить иначе — " +
        nb(peers.n) + " раз. Обычно умирали в " + years(peers.median) + ".</div>" +
    "</div>" +
    '<button class="btn" id="btn-share"><span>Поделиться</span><span class="arrow">→</span></button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn ghost" id="btn-copy"><span>Скопировать текст</span><span class="arrow"></span></button>' +
    '<div style="height:10px"></div>' +
    '<button class="btn ghost" id="btn-again2"><span>Ещё жизнь</span><span class="arrow">→</span></button>' +
    '<div class="links" style="justify-content:center"><button id="btn-home">На главную</button></div>';

  $("btn-share").onclick = async () => {
    const text = cardText();
    if(navigator.share){ try{ await navigator.share({title:"Жребий", text}); }catch(e){} }
    else { await copyText(text); toast("Текст скопирован"); }
  };
  $("btn-copy").onclick = async () => { await copyText(cardText()); toast("Текст скопирован"); };
  $("btn-again2").onclick = () => startLife((Date.now() ^ (Math.random()*1e9)) >>> 0);
  $("btn-home").onclick = () => show("s-start");
}

/* ---------- архив ---------- */
const LS = "zherebey.v1";
function loadArchive(){ try{ return JSON.parse(localStorage.getItem(LS) || "[]"); }catch(e){ return []; } }
function saveLife(){
  const arr = loadArchive();
  arr.unshift({at:Date.now(), country:L.b.c.ru, name:L.b.name, age:L.deathAge,
    h:Math.round(L.h), p:Math.round(L.p), k:Math.round(L.k), r:Math.round(L.r),
    money:Math.round(L.money), cause:L.cause, legacy:legacyLine()});
  try{ localStorage.setItem(LS, JSON.stringify(arr.slice(0,60))); }catch(e){}
}
function renderArchive(){
  const arr = loadArchive();
  let html = '<div class="masthead"><div class="wordmark">Жребий</div><div class="chapter">архив</div></div><hr class="rule">' +
    '<h1 style="font-size:34px;margin:26px 0 18px">Прожитые жизни</h1>';
  if(!arr.length){
    html += '<p class="lede">Пока пусто. Первая жизнь займёт три минуты.</p>';
  } else {
    html += arr.map(x => '<div class="arch-row"><div class="arch-age num">' + x.age + "</div>" +
      '<div><div class="arch-body">' + x.legacy + '</div><div class="arch-meta">' + x.country + " · " +
      x.cause + " · " + new Date(x.at).toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"}) + "</div></div></div>").join("");
  }
  html += '<div style="height:22px"></div><button class="btn" id="btn-again3"><span>Новая жизнь</span><span class="arrow">→</span></button>' +
    '<div class="links"><button id="btn-clear">Очистить архив</button><button id="btn-home2">На главную</button></div>';
  $("s-archive").innerHTML = html;
  $("btn-again3").onclick = () => startLife((Date.now() ^ (Math.random()*1e9)) >>> 0);
  $("btn-clear").onclick = () => { if(confirm("Удалить все сохранённые жизни?")){ localStorage.removeItem(LS); renderArchive(); } };
  $("btn-home2").onclick = () => show("s-start");
}

/* ---------- правила ---------- */
function renderHow(){
  $("s-how").innerHTML =
    '<div class="masthead"><div class="wordmark">Жребий</div><div class="chapter">правила</div></div><hr class="rule">' +
    '<h1 style="font-size:34px;margin:26px 0 8px">Как это устроено</h1>' +
    '<div class="how">' +
      "<h3>старт не выбирается</h3><p>Страна, семья, достаток и здоровье — из распределений, не из настроек. Выборы меняют шансы, а не гарантируют исход.</p>" +
      "<h3>тринадцать глав</h3><p>Каждый выбор двигает четыре шкалы: здоровье, счастье, знания, близкие. Деньги считаются отдельно — заработком, расходами и потерями.</p>" +
      "<h3>деньги не растут сами</h3><p>Доход зависит от страны, знаний и пола, расходы — от возраста и здоровья. Часть жизней заканчивается в нуле или в долге.</p>" +
      "<h3>без тяжёлого без предупреждения</h3><p>Возраст 15+. Сцен насилия и способов уйти из жизни в этой версии нет — это позиция, а не забывчивость.</p>" +
      "<h3>откуда числа</h3><p class=\"src\">Продолжительность жизни, младенческая смертность, ВВП на человека по паритету и число рождений — Всемирный банк, 2023, выгрузка 01.11.2026. Десять стран. Вес страны — доля рождений, сглаженная корнем: иначе половина жизней была бы индийской. Достаток семьи — логнормальное распределение вокруг ВВП: это модель, а не данные о человеке.</p>" +
    "</div>" +
    '<div style="height:26px"></div><button class="btn ghost" id="btn-back-start"><span>Назад</span><span class="arrow">←</span></button>';
  $("btn-back-start").onclick = () => show("s-start");
}

/* ---------- события ---------- */
$("event").addEventListener("click", e => {
  const b = e.target.closest(".option");
  if(!b) return;
  if(b.dataset.next){ nextStage(false); return; }
  const i = Number(b.dataset.i);
  if(!Number.isNaN(i) && currentEvent) choose(i);
});
$("btn-born").onclick = () => startLife((Date.now() ^ (Math.random()*1e9)) >>> 0);
$("btn-archive").onclick = () => { renderArchive(); show("s-archive"); };
$("btn-how").onclick = () => { renderHow(); show("s-how"); };

/* свежесть сборки */
(function(){
  const build = document.documentElement.dataset.build;
  fetch("version.txt?_=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.text() : null)
    .then(v => { v = (v||"").trim();
      if(v && v !== build && !location.search.includes("v=" + v)) location.replace(location.pathname + "?v=" + v);
    }).catch(()=>{});
})();

window.ZH = {newLife, autoRun, peersStats, COUNTRIES, EVENTS, STAGES, makeBirth, deathProb,
  setLife:l=>{L=l;}, getLife:()=>L};
</script>
